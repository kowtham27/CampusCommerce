services:
  db:
    image: postgres:16-alpine
    container_name: campus-commerce-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus
      POSTGRES_DB: campus_commerce
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus_commerce"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
